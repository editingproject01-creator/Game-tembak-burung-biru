<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Viewport disesuaikan agar tidak bisa di-zoom tidak sengaja saat tap cepat -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Tembak Burung Modern</title>

    <style>
        :root {
            --primary-color: #4ECDC4;
            --accent-color: #FF6B6B;
            --bg-color: #1A1A2E;
            --card-bg: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; /* Hilangkan highlight tap di HP */
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            height: 100dvh; /* Menggunakan dynamic viewport height untuk iOS Safari */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Posisi elemen rapat ke atas */
            color: #fff;
            overflow: hidden;
            padding: 10px 15px;
        }

        header {
            margin-top: 5px; /* Dinaikkan ke atas */
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem; /* Ukuran font disesuaikan untuk layar HP */
            letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 8px;
            color: #FFE66D;
        }

        /* Dashboard Skor Compact */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 15px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 100%;
        }

        .score-box {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .score-box span {
            color: var(--primary-color);
            font-size: 0.95rem;
            display: block;
        }

        /* Area Arena Permainan (Dinaikkan & Disesuaikan untuk HP) */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 52vh; /* Mengurangi tinggi agar naik ±100px */
            max-height: 420px;
            margin-top: 10px; /* Jarak dibuat sangat ringkas */
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            cursor: crosshair;
            touch-action: none; /* Mencegah geser layar tak sengaja saat main di HP */
        }

        /* Styling Karakter Burung */
        #bird {
            position: absolute;
            width: 55px;
            height: 55px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            display: none;
            touch-action: manipulation;
        }

        #bird:active {
            transform: scale(0.85);
        }

        /* Tombol Main / Reset (Dinaikkan) */
        .btn-restart {
            margin-top: 12px; /* Posisi lebih naik ke atas */
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.2s ease;
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        /* Animasi Efek Meledak */
        .explode {
            animation: pop 0.25s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Media Query Khusus Layar Sangat Kecil / Layar HP Pendek */
        @media (max-height: 650px) {
            h1 { font-size: 1.2rem; margin-bottom: 4px; }
            #game-container { height: 45vh; }
            .btn-restart { margin-top: 8px; padding: 8px 20px; font-size: 0.85rem; }
        }
    </style>
</head>

    <div id="game-container">
